[package]
name = "scx_atlas"
version = "1.1.1"
authors = ["Daniel Hodges <hodges.daniel.scott@gmail.com>"]
edition = "2021"
description = "scx_atlas - AI Training Latency-Aware Scheduler (prototype)"
license = "GPL-2.0-only"

[package.metadata.scx]
ci.use_clippy = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"] }
crossbeam = "0.8"
ctrlc = { version = "3", features = ["termination"] }
lazy_static = "1"
libbpf-rs = "=0.26.2"
libc = "0.2"
log = "0.4"
regex = "1"
scx_stats = { path = "../../../rust/scx_stats", version = "1.1.1" }
scx_stats_derive = { path = "../../../rust/scx_stats/scx_stats_derive", version = "1.1.1" }
scx_utils = { path = "../../../rust/scx_utils", version = "1.1.1" }
serde = { version = "1", features = ["derive"] }
simplelog = "0.12"

[build-dependencies]
scx_cargo = { path = "../../../rust/scx_cargo", version = "1.1.1" }

[features]
enable_backtrace = []
